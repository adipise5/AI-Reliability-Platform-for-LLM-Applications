apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: arp
    user: auth
    secureJsonData:
      password: auth
    jsonData:
      sslmode: disable
      # Every service owns its own schema (see ADR-0002); Grafana's
      # Postgres data source has no notion of "current schema" per query,
      # so dashboard queries below schema-qualify every table
      # (e.g. cost_analytics.usage_records).
      postgresVersion: 1600
