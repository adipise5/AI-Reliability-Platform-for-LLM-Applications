# Copy to values-secrets.yaml (already .gitignored — see infra/k8s/helm/.gitignore)
# and fill in real values before installing against a real cluster:
#
#   helm install arp ./platform -f values-secrets.yaml
#
# Same split as every service's own .env.example vs. docker-compose.yml:
# connection strings and credentials never live in the checked-in
# values.yaml, only here.

auth:
  envSecret:
    AUTH_DATABASE_URL: "postgresql+asyncpg://auth:CHANGEME@postgres:5432/arp"
    AUTH_JWT_SECRET: "CHANGEME"

prompt-registry:
  envSecret:
    PROMPT_REGISTRY_DATABASE_URL: "postgresql+asyncpg://prompt_registry:CHANGEME@postgres:5432/arp"

dataset-management:
  envSecret:
    DATASET_MGMT_DATABASE_URL: "postgresql+asyncpg://dataset_mgmt:CHANGEME@postgres:5432/arp"

trace-collector:
  envSecret:
    TRACE_COLLECTOR_DATABASE_URL: "postgresql+asyncpg://trace_collector:CHANGEME@postgres:5432/arp"

gateway:
  envSecret:
    # Leave GATEWAY_STATIC_API_KEYS unset (or empty) once the Auth service
    # is reachable — it's a dev-only bypass, see ADR-0003.
    GATEWAY_ANTHROPIC_API_KEY: "CHANGEME"
    GATEWAY_OPENAI_API_KEY: "CHANGEME"
    GATEWAY_GEMINI_API_KEY: "CHANGEME"

evaluation-engine:
  envSecret:
    EVAL_ENGINE_DATABASE_URL: "postgresql+asyncpg://eval_engine:CHANGEME@postgres:5432/arp"
    EVAL_ENGINE_REDIS_URL: "redis://redis:6379/0"

evaluation-engine-worker:
  envSecret:
    EVAL_ENGINE_DATABASE_URL: "postgresql+asyncpg://eval_engine:CHANGEME@postgres:5432/arp"
    EVAL_ENGINE_REDIS_URL: "redis://redis:6379/0"

hallucination-detection:
  envSecret:
    HALLUCINATION_DATABASE_URL: "postgresql+asyncpg://hallucination:CHANGEME@postgres:5432/arp"

experiment-tracking:
  envSecret:
    EXPERIMENT_TRACKING_DATABASE_URL: "postgresql+asyncpg://experiment_tracking:CHANGEME@postgres:5432/arp"

cost-analytics:
  envSecret:
    COST_ANALYTICS_DATABASE_URL: "postgresql+asyncpg://cost_analytics:CHANGEME@postgres:5432/arp"

regression-detection:
  envSecret:
    REGRESSION_DATABASE_URL: "postgresql+asyncpg://regression:CHANGEME@postgres:5432/arp"

report-generator:
  envSecret:
    REPORT_GENERATOR_DATABASE_URL: "postgresql+asyncpg://report_generator:CHANGEME@postgres:5432/arp"
    REPORT_GENERATOR_REDIS_URL: "redis://redis:6379/0"

report-generator-worker:
  envSecret:
    REPORT_GENERATOR_DATABASE_URL: "postgresql+asyncpg://report_generator:CHANGEME@postgres:5432/arp"
    REPORT_GENERATOR_REDIS_URL: "redis://redis:6379/0"

notification-service:
  envSecret:
    NOTIFICATION_DATABASE_URL: "postgresql+asyncpg://notifications:CHANGEME@postgres:5432/arp"
    NOTIFICATION_REDIS_URL: "redis://redis:6379/0"
    NOTIFICATION_SMTP_USERNAME: "CHANGEME"
    NOTIFICATION_SMTP_PASSWORD: "CHANGEME"

notification-service-worker:
  envSecret:
    NOTIFICATION_DATABASE_URL: "postgresql+asyncpg://notifications:CHANGEME@postgres:5432/arp"
    NOTIFICATION_REDIS_URL: "redis://redis:6379/0"
    NOTIFICATION_SMTP_USERNAME: "CHANGEME"
    NOTIFICATION_SMTP_PASSWORD: "CHANGEME"

github-integration:
  envSecret:
    GITHUB_INTEGRATION_DATABASE_URL: "postgresql+asyncpg://github_integration:CHANGEME@postgres:5432/arp"
    GITHUB_INTEGRATION_GITHUB_TOKEN: "CHANGEME"
    GITHUB_INTEGRATION_GITHUB_WEBHOOK_SECRET: "CHANGEME"

# dashboard-backend has no database and no secrets of its own — omitted.
