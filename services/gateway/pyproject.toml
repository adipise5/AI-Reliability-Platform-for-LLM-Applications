[project]
name = "gateway"
version = "0.1.0"
description = "AI Reliability Platform — AI Gateway service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "prometheus-fastapi-instrumentator>=7.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "anthropic>=0.34",
  "openai>=1.40",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  # arp-auth-client (../../libs/auth-client) is NOT listed here: pip does
  # not reliably resolve relative `file:` dependency specs in pyproject.toml.
  # Install it explicitly first — see README.md "Running locally".
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["gateway"]
mypy_path = "src"
strict = true
