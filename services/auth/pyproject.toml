[project]
name = "auth"
version = "0.1.0"
description = "AI Reliability Platform — Authentication Service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "prometheus-fastapi-instrumentator>=7.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "bcrypt>=4.1",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["auth"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
