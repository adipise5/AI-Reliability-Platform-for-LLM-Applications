[project]
name = "arp-auth-client"
version = "0.1.0"
description = "AI Reliability Platform — shared client for the Authentication Service's introspection endpoint"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["auth_client"]
mypy_path = "src"
strict = true
